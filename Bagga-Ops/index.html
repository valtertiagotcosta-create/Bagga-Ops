<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B5E3B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bagga Ops">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Bagga Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F6; --card:#FFFFFF; --ink:#2B1D12; --muted:#6B7280; --line:#E5E7EB;
  --brand:#8A4B1F; --brand-2:#B5652A; --custard:#F2B544; --custard-soft:#FCEBC4;
  --ok:#2F8F5B; --ok-soft:#DDF1E5; --bad:#C8442F; --bad-soft:#F9DED8; --warn:#C27C00; --warn-soft:#FBEBC8;
  --na:#9A8F84; --radius:14px; --shadow:0 1px 2px rgba(60,35,10,.06),0 4px 14px rgba(60,35,10,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:10;background:#1B5E3B;color:#fff;padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left))}
#sair{color:#fff;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);margin-left:auto}
.top-in{max-width:980px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;padding-bottom:8px}
.logo{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#5a2a0c 0 18%,var(--custard) 22% 62%,#f7d98a 66% 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);flex:none}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand small{opacity:.8;font-size:12.5px}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;color:#fff;opacity:.75;padding:6px 10px 6px;border-bottom:3px solid transparent;font-weight:600;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;min-width:64px}
nav button svg{width:20px;height:20px}
.apgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:4px 0 18px}
.ap{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 4px 12px;box-shadow:none;font-weight:500;font-size:12.5px;color:var(--ink);text-align:center;transition:border-color .15s,box-shadow .15s}
.ap:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.ap:active{transform:scale(.97)}
.ap .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--custard-soft);color:var(--brand)}
.ap .ic svg{width:24px;height:24px}
.ap .bd{position:absolute;top:6px;right:7px;min-width:20px;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:2px 6px}
@media(max-width:360px){.apgrid{gap:7px}.ap{font-size:11.5px}.ap .ic{width:44px;height:44px}}
nav button.on{opacity:1;border-bottom-color:var(--custard)}
main{max-width:980px;margin:0 auto;padding:16px 14px 90px}
.aviso{max-width:980px;margin:10px auto 0;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:#6b4500;font-size:14px}
h2{font-size:20px;margin:6px 0 12px;letter-spacing:-.01em}
h3{font-size:15px;margin:18px 0 8px;color:var(--brand);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:12px 14px}
.kpi b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em}
.kpi span{color:var(--muted);font-size:13px}
.kpi.bad b{color:var(--bad)} .kpi.ok b{color:var(--ok)}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-2)}
.btn.ghost{background:none;border-color:transparent;color:var(--brand)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=date],input[type=search],textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:10px 0 4px}
.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:12px}
@media(max-width:640px){.filters{grid-template-columns:1fr auto}.filters .seg{grid-column:1/-1;display:flex}.filters .seg button{flex:1;padding:6px 4px}}
.filters .cbx{white-space:nowrap}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-weight:600;color:var(--muted);font-size:13.5px}
.seg button.on{background:var(--custard-soft);color:var(--brand)}
.list{display:flex;flex-direction:column;gap:8px}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer}
.task.done{opacity:.6}
.task.done .tt{text-decoration:line-through}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:#fff;flex:none;display:grid;place-items:center;margin-top:1px;color:#fff;font-size:14px}
.chk.on{background:var(--ok);border-color:var(--ok)}
.tt{font-weight:600}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;font-size:12.5px;color:var(--muted);align-items:center}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#F3ECE0;color:var(--ink);font-size:12px;font-weight:600}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.br{background:var(--custard-soft);color:var(--brand)}
.pri-alta{border-left:4px solid var(--bad)} .pri-media{border-left:4px solid var(--custard)} .pri-baixa{border-left:4px solid var(--line)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
tr.click{cursor:pointer} tr.click:hover td{background:#FFFBF2}
.score{display:inline-grid;place-items:center;min-width:46px;padding:3px 8px;border-radius:8px;font-weight:700;font-size:13.5px}
.s-ok{background:var(--ok-soft);color:var(--ok)} .s-warn{background:var(--warn-soft);color:var(--warn)} .s-bad{background:var(--bad-soft);color:var(--bad)} .s-none{background:#F3ECE0;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.vsec{margin-bottom:14px;padding:0;overflow:hidden}
.vsec h4{margin:0;padding:12px 14px;background:#FFF8EA;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--brand);display:flex;justify-content:space-between}
.item{padding:12px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item-top{display:flex;gap:10px;align-items:center}
.item-top .txt{flex:1}
.ans{display:flex;gap:6px;flex:none}
.ans button{width:44px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:15px;color:var(--muted)}
.ans button.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ans button.nok.on{background:var(--bad);border-color:var(--bad);color:#fff}
.ans button.na.on{background:var(--na);border-color:var(--na);color:#fff}
.ans button.na{font-size:12px}
.item-extra{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.item-extra textarea{min-height:52px}
.cbx{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink);font-weight:600}
.cbx input{width:18px;height:18px;accent-color:var(--brand)}
.progress{height:8px;background:#EFE4D2;border-radius:99px;overflow:hidden;margin:8px 0 14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--custard),var(--brand-2));width:0;transition:width .2s}
.stickybar{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(251,246,236,0),var(--bg) 30%);padding:18px 0 10px;display:flex;gap:8px;justify-content:flex-end}
.res{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.res:last-child{border-bottom:0}
.res .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;color:#fff}
.ic.ok{background:var(--ok)} .ic.nok{background:var(--bad)} .ic.na{background:var(--na)} .ic.no{background:#D9CDBB}
.res small{display:block;color:var(--muted);margin-top:2px}
.modal{position:fixed;inset:0;background:rgba(43,29,18,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px 22px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin-top:0}
.notes{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.note{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px}
.note small{color:var(--muted);display:block;margin-bottom:2px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:90vw}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--custard-soft);color:var(--brand);border-radius:999px;padding:3px 6px 3px 10px;font-size:13px;font-weight:600}
.chip button{border:0;background:rgba(138,75,31,.12);color:var(--brand);width:20px;height:20px;border-radius:50%;font-size:12px;line-height:1}
.loja{padding:12px 14px}
.hits{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.hits button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px}
.ck-item{display:flex;gap:6px;margin:6px 0}
.ck-item input{flex:1}
.muted{color:var(--muted)}
.mt{margin-top:12px}
.loading{color:var(--muted);text-align:center;padding:40px 0}
/* fotos */
.datenav{display:flex;align-items:center;gap:6px}
.datenav input{width:auto}
.mx{width:100%;border-collapse:separate;border-spacing:4px}
.mx th{text-align:center;padding:4px 2px;font-size:11px;border:0}
.mx th:first-child{text-align:left}
.mx td{padding:0;border:0;text-align:center}
.mx td.ln{text-align:left;font-weight:600;font-size:13.5px;padding-right:6px;white-space:nowrap}
.cell{width:100%;min-width:46px;height:52px;border-radius:10px;border:2px solid var(--line);background:#fff;padding:0;overflow:hidden;position:relative;display:grid;place-items:center;font-size:16px;font-weight:700}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .bdg{position:absolute;right:2px;bottom:2px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;font-weight:700}
.cell .n{position:absolute;left:3px;top:2px;font-size:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:0 4px}
.c-ok{border-color:var(--ok)} .c-ok .bdg{background:var(--ok)}
.c-nok{border-color:var(--bad)} .c-nok .bdg{background:var(--bad)}
.c-pend{border-color:var(--custard)} .c-pend .bdg{background:var(--warn)}
.c-falta{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.c-prazo{border-style:dashed;color:#c9bba6}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:8px 2px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px;border:2px solid}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.tile{padding:12px}
.tile-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tile-h b{flex:1;font-size:15.5px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.thumbs button{width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line);padding:0;background:#F3ECE0}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.upbtn{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--brand-2);color:var(--brand);background:#FFF8EA;border-radius:12px;padding:12px;font-weight:700;cursor:pointer;text-align:center}
.upbtn input{display:none}
.upbtn.busy{opacity:.6;pointer-events:none}
.bigph{display:flex;flex-direction:column;gap:10px}
.bigph figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bigph img{width:100%;display:block;max-height:60vh;object-fit:contain;background:#1d140c}
.bigph figcaption{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:13px;color:var(--muted)}
.falta-l{display:flex;flex-direction:column;gap:6px}
.falta-l .card{padding:10px 12px;font-size:14px}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:14px;cursor:pointer}
.banner .big{font-size:22px}
.banner .bic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--custard-soft);color:var(--brand);flex:none}
.banner .bic svg{width:22px;height:22px}
.cxsec{font-weight:700;font-size:13px;padding:10px 2px 6px;cursor:default}.cxsec.bad{color:var(--bad)}.cxsec.ok{color:var(--ok)}
.cxpend{border-left:4px solid var(--bad);padding-left:6px;border-radius:4px}
.cxfeit summary{cursor:pointer;list-style:none}.cxfeit summary::before{content:'▸ ';}.cxfeit[open] summary::before{content:'▾ ';}.cxfeit{opacity:.85}
.invpop .c-inventarios svg{width:36px;height:36px}
.c-fotos{background:#DBEAFE!important;color:#2563EB!important}.c-tarefas{background:#DCFCE7!important;color:#16A34A!important}.c-inventarios{background:#FEF3C7!important;color:#D97706!important}.c-caixa{background:#CCFBF1!important;color:#0D9488!important}.c-avarias{background:#FEE2E2!important;color:#DC2626!important}.c-encomendas{background:#EDE9FE!important;color:#7C3AED!important}.c-lojas{background:#E2E8F0!important;color:#475569!important}
.gtab td,.gtab th{font-size:12.5px;padding:8px 6px}
.gtab tr.selrow td{background:#FFF3DA}
.cxloja{margin-bottom:12px;padding:10px}
.cxhead,.cxrow{display:grid;grid-template-columns:70px 90px 130px 120px 1fr;gap:6px;align-items:center}
.cxhead{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:0 6px 4px;border-bottom:1px solid var(--line)}
.cxrow{padding:5px 6px;border-bottom:1px solid var(--line);font-size:13.5px}
.cxrow:last-child{border-bottom:0}
.cxrow select,.cxrow input{padding:6px 8px;font-size:13px}
.cxrow input:disabled,.cxrow select:disabled{background:#F7F1E6;color:#a99}
.cx-v{font-weight:700;text-align:right;white-space:nowrap}
.cxrow.alerta{background:var(--bad-soft);border-radius:8px;border-bottom-color:transparent;margin:2px 0}
.cxrow.alerta.feito{background:#FBEFE6}
@media(max-width:700px){.cxhead{display:none}.cxrow{grid-template-columns:1fr 1fr;grid-template-areas:"d v" "r n" "j j"}.cx-d{grid-area:d}.cx-v{grid-area:v}.cx-r{grid-area:r}.cx-n{grid-area:n}.cx-j{grid-area:j}}
.engrp h3{margin:14px 0 4px}
.enrow{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:10px;background:#fff;border:1px solid var(--line);margin-bottom:4px;font-size:14px}
.enrow.on{border-color:var(--brand-2);background:#FFF8EA;font-weight:600}
.enrow .stp{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:700;color:var(--brand);flex:none}
.enrow .enq{width:52px;text-align:center;padding:6px;flex:none;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cwd{text-align:center;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;padding:2px 0}
.cday{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:64px;padding:3px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cday.out{background:none;border:0}
.cday.has{cursor:pointer}
.cday.today{border:2px solid var(--custard)}
.cday.sel{outline:2px solid var(--brand);outline-offset:-1px}
.cday .dn{font-size:11.5px;font-weight:700;color:var(--muted)}
.cchip{display:block;font-size:10px;line-height:1.25;font-weight:700;color:#fff;background:var(--c);border-radius:4px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cchip.ok{opacity:.55}
.cchip.bad{box-shadow:inset 0 0 0 2px var(--bad);background:var(--bad-soft);color:var(--bad)}
@media(min-width:700px){.cday{min-height:84px}.cchip{font-size:11.5px;padding:2px 5px}}
.restab td,.restab th{text-align:right;white-space:nowrap}
.restab td:first-child,.restab th:first-child{text-align:left}
.restab td.rc{cursor:pointer}
.restab td.rc:hover{background:#FFFBF2}
.restab tr.tot td{border-top:2px solid var(--line);background:#FFF8EA}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand" style="width:100%"><span class="logo" aria-hidden="true"></span><div><h1>Bagga Ops</h1><small id="quem">A carregar…</small></div><button id="sair" class="btn sm" hidden onclick="confirmar('Sair desta conta neste telemóvel?', 'Sair').then(ok => ok && window.SAIR && window.SAIR())">Sair</button></div>
  <nav id="nav"></nav>
</div></header>
<div id="aviso" class="aviso" hidden></div>
<main id="app"><div class="loading">A carregar…</div></main>
<div id="modal" class="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="pwa.js"></script>
<script>
/* ---------- Modelo base da checklist (usado enquanto não houver um modelo guardado) ---------- */
const CHECKLIST_BASE = { seccoes: [
  { titulo: 'Imagem e limpeza', itens: [
    ['img1','Fachada, montra e reclamos limpos e acesos'],
    ['img2','Sala, mesas e cadeiras limpas e arrumadas'],
    ['img3','WC limpo e abastecido'],
    ['img4','Equipa fardada e com boa apresentação'] ] },
  { titulo: 'Produto e balcão', itens: [
    ['pr1','Pastéis de nata frescos, com boa cozedura e temperatura'],
    ['pr2','Balcão de exposição completo e apelativo'],
    ['pr3','Validades e etiquetas de preço corretas'],
    ['pr4','Artigos com maior margem >65% em destaque'] ] },
  { titulo: 'Equipa e serviço', itens: [
    ['eq1','Escala de horários face aos picos de consumo'],
    ['eq2','Tempo de espera no atendimento adequado'],
    ['eq3','Sugestão de venda adicional ao cliente'],
    ['eq4','Simpatia e acolhimento'] ] },
  { titulo: 'Operação', itens: [
    ['op1','Caixa/POS sem diferenças e fundo de caixa correto'],
    ['op2','Quebras registadas (alimentar, tabaco, Jogos Santa Casa)'],
    ['op3','Stock e encomendas ajustados às vendas'],

  if (!S.db || S.readOnly) { toast('Sem permissão para guardar.'); return false; }

  catch (e) {

    else if (e && (e.code === 'quota_exceeded' || e.code === 'resource-exhausted')) toast('A base de dados está cheia. Apaga registos antigos.');
    else if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random()*600)); try { await fn(); if (okMsg) toast(okMsg); return true; } catch (e2) { toast('Não foi possível guardar. Tenta de novo.'); } }
    else toast('Não foi possível guardar. Tenta de novo.');
    return false;
  }
}

const agoraHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const lojasDoMembro = uid => { const m = S.membros.find(x => x.id === uid); return m ? (m.lojas || []) : []; };
const gerentesDe = l => [...new Set([...(l.gerentes || []), ...S.membros.filter(m => (m.lojas || []).includes(l.id)).map(m => m.id)])];

function estadoFoto(lojaId, data, p) {
  const doc = S.fotos[fotoId(data, lojaId, p.id)];
  const tem = doc && (doc.itens || []).length;
  if (tem) return { doc, st: doc.estado === 'ok' ? 'ok' : doc.estado === 'nok' ? 'nok' : 'pend' };
  const h = hoje();
  const passou = data < h || (data === h && agoraHM() >= p.ate);
  return { doc: null, st: passou ? 'falta' : 'prazo' };
}
function diasJanela(n) { const out = []; for (let i = 0; i < n; i++) out.push(addDias(-i)); return out; }
function emFalta(dias, lojas) {

  })));
  return out;
}
const imgCache = {};
function srcFoto(it) {
  if (it.asset) return '/_blob/' + it.asset;
  if (it.img) {
    if (imgCache[it.img]) return imgCache[it.img];
    if (!(it.img in imgCache) && S.db) {
      imgCache[it.img] = '';
      S.db.doc('fotosImg/' + it.img).get().then(s => {
        const u = s.exists ? (s.data().data || '') : '';
        if (!/^data:image\/(jpeg|png|webp);base64,/.test(u)) return;
        imgCache[it.img] = u;
        document.querySelectorAll(`img[data-img="${it.img}"]`).forEach(e => e.src = u);
      }).catch(() => {});
    }
    return '';
  }
  return '';
}
function imgTag(it) { const s = srcFoto(it); return `<img alt="" loading="lazy" ${it.img ? `data-img="${esc(it.img)}"` : ''} ${s ? `src="${esc(s)}"` : ''} onerror="this.style.opacity=.2">`; }

async function comprimir(file, max, q) {
  let src, w, h;
  try { src = await createImageBitmap(file); w = src.width; h = src.height; }
  catch (e) {
    src = new Image(); const u = URL.createObjectURL(file); src.src = u;
    await src.decode(); w = src.naturalWidth; h = src.naturalHeight;
  }
  const s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', q));
}
const blobToDataURL = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); });

async function guardarImagem(f, meta) {
  if (S.assets) {
    try {
      const b = await comprimir(f, 1600, 0.82);
      const r = await S.assets.upload(b, { type: 'image/jpeg' });
      return { asset: r.id };
    } catch (e) { if (e && e.code === 'quota_or_state') { toast('O espaço para fotos está cheio.'); return null; } }
  }
  let b = await comprimir(f, 1000, 0.7); let u = await blobToDataURL(b);
  if (u.length > 230000) { b = await comprimir(f, 760, 0.6); u = await blobToDataURL(b); }
  if (u.length > 250000) { toast('Foto demasiado grande.'); return null; }
  const ref = S.db.collection('fotosImg').doc();
  const ok = await escrever(() => ref.set({ data: u, ...meta }));
  return ok ? { img: ref.id } : null;
}
async function enviarFotos(files, lojaId, data, pid) {
  if (!podeEscrever()) { toast('Sem permissão para enviar fotos.'); return; }
  const key = fotoId(data, lojaId, pid);
  S.uploading.add(key); renderDados();
  const novos = [];
  try {
    for (const f of files) {
      if (!f.type.startsWith('image/')) continue;
      const item = await guardarImagem(f, { lojaId, dia: data, periodo: pid });
      if (!item) break;
      novos.push({ ...item, autorId: S.me || null, em: new Date().toISOString() });
    }
    if (novos.length) {
      const atual = S.fotos[key];
      const ref = S.db.doc('fotos/' + key);
      const ok = atual
        ? await escrever(() => ref.update({ itens: [...(atual.itens || []), ...novos], estado: null, verificadoPor: null, verificadoEm: null }))
        : await escrever(() => ref.set({ lojaId, data, periodo: pid, itens: novos, estado: null, criadoEm: new Date().toISOString() }));
      if (ok) toast(novos.length > 1 ? `${novos.length} fotos enviadas ✓` : 'Foto enviada ✓');
    }
  } catch (e) { toast('Não foi possível enviar a foto.'); }
  S.uploading.delete(key); renderDados();
  if (!$('#modal').hidden && $('#sheet').dataset.foto === key) abrirFotos(lojaId, data, pid);
}

function eMinha(t) {

  const l = lojaById(t.lojaId); return !!(l && gerentesDe(l).includes(S.me));
}
function atrasada(t) { return t.estado !== 'feita' && t.prazo && t.prazo < hoje(); }
function ordenarTarefas(a, b) {
  const da = a.estado === 'feita', dbb = b.estado === 'feita';
  if (da !== dbb) return da ? 1 : -1;
  if (da) return (b.concluidaEm || '').localeCompare(a.concluidaEm || '');
  const pa = a.prazo || '9999', pb = b.prazo || '9999';
  if (pa !== pb) return pa.localeCompare(pb);
  const ord = { alta: 0, media: 1, baixa: 2 };
  return (ord[a.prioridade] ?? 1) - (ord[b.prioridade] ?? 1);
}
function prazoPill(t) {
  if (!t.prazo || t.estado === 'feita') return t.prazo ? `<span>Prazo ${fmtData(t.prazo)}</span>` : '';
  const h = hoje();
  if (t.prazo < h) return `<span class="pill bad">Atrasada · ${fmtData(t.prazo)}</span>`;
  if (t.prazo === h) return `<span class="pill warn">Hoje</span>`;
  if (t.prazo <= addDias(3)) return `<span class="pill warn">${fmtData(t.prazo)}</span>`;
  return `<span>Prazo ${fmtData(t.prazo)}</span>`;
}

function listaFalta(lojas) {

      <div class="row"><b class="sp">${esc(g.loja.nome)}</b><span class="pill bad">${g.itens.length} em falta</span></div>
      <div class="meta" style="margin-top:6px">${g.itens.map(x => `<span class="pill" style="cursor:pointer" data-a="ffIr" data-d="${x.data}">${fmtData(x.data).slice(0, 5)} · ${esc(x.p.nome)}</span>`).join('')}</div>
    </div>`).join('') : `<div class="card empty">${S.loaded.fotos ? 'Nenhuma foto em falta neste período. 👏' : 'A carregar…'}</div>`}</div>`;
}
function vFotos() {

function stPill(e, p) {
  return { ok: '<span class="pill ok">✓ Verificada</span>', nok: '<span class="pill bad">✗ Não conforme</span>', pend: '<span class="pill warn">Enviada</span>',

}
function tileFoto(l, d, p) {
  const e = estadoFoto(l.id, d, p); const key = fotoId(d, l.id, p.id); const its = e.doc ? (e.doc.itens || []) : [];
  const busy = S.uploading.has(key);
  return `<div class="card tile"><div class="tile-h"><b>${esc(p.nome)}</b>${stPill(e, p)}</div>
    ${its.length ? `<div class="thumbs">${its.map(it => `<button data-a="abrirFotos" data-l="${esc(l.id)}" data-d="${d}" data-p="${esc(p.id)}">${imgTag(it)}</button>`).join('')}</div>` : ''}
    ${e.doc && e.doc.estado === 'nok' && e.doc.obs ? `<div class="note" style="margin-bottom:8px"><small>Comentário do responsável</small>${esc(e.doc.obs)}</div>` : ''}
    ${podeEscrever() && (S.isAdmin || l.id === minhaLoja()) ? `<label class="upbtn ${busy ? 'busy' : ''}">${busy ? 'A enviar…' : (its.length ? '📷 Juntar outra foto' : '📷 Tirar / enviar foto')}

}
function abrirFotos(lojaId, d, pid) {

  const l = lojaById(lojaId); const e = estadoFoto(lojaId, d, p); const its = e.doc ? (e.doc.itens || []) : [];
  const key = fotoId(d, lojaId, pid);

      </figcaption></figure>`).join('')}</div>` : `<div class="card empty">${e.st === 'falta' ? 'A loja não enviou foto neste período.' : 'Ainda sem fotos.'}</div>`}

    ${podeEscrever() && (!S.isAdmin || its.length === 0) && (S.isAdmin || lojaId === minhaLoja()) ? `<label class="upbtn mt">📷 ${its.length ? 'Juntar outra foto' : 'Enviar foto'}<input type="file" accept="image/*" capture="environment" multiple data-c="foto" data-l="${esc(lojaId)}" data-d="${d}" data-p="${esc(pid)}"></label>` : ''}
    <div class="row mt"><span class="sp"></span><button class="btn" data-a="fechar">Fechar</button></div>`);
  $('#sheet').dataset.foto = key;

/* ---------- inventários ---------- */
const fimSemana = () => { const d = new Date(); d.setDate(d.getDate() + ((7 - d.getDay()) % 7)); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const invFim = i => i.dataFim || i.data;
let invAvisoMostrado = false;
function avisoInventario() {
  if (invAvisoMostrado || S.isAdmin || !minhaLoja() || !podeEscrever() || !S.loaded.inventarios) return;
  if (!$('#modal').hidden) return;
  const h = hoje();
  const lst = S.inventarios.filter(i => i.lojaId === minhaLoja() && i.estado !== 'feito' && i.data <= h && invFim(i) >= h && !(i.conhecimento && i.conhecimento.dia === h));
  if (!lst.length) return;
  invAvisoMostrado = true;
  abrirModal(`<div class="invpop" style="text-align:center;padding:6px 4px">

    <h2 style="margin:0 0 6px">Hoje é dia de inventário</h2>
    <p class="muted" style="margin:0 0 12px">A ${esc(nomeLoja(minhaLoja()))} tem de realizar:</p>
    ${lst.map(i => `<div class="card" style="padding:10px 12px;margin-bottom:6px;text-align:left"><b>${i.tipo === 'global' ? 'Inventário global' : esc(invTipoTxt(i))}</b>${i.hora ? ` <span class="muted">às ${esc(i.hora)}</span>` : ''}${i.dataFim && i.dataFim !== i.data ? `<div class="muted" style="font-size:12.5px">Prazo até ${esc(fmtData(i.dataFim))}</div>` : ''}</div>`).join('')}
    <p class="muted" style="font-size:12.5px;margin:10px 0 14px">Depois de o fazer, regista o resultado no separador Inventários.</p>
    <button class="btn pri" style="width:100%;padding:13px;font-size:15px" data-a="invConhecimento" data-ids="${esc(lst.map(i => i.id).join(','))}">✓ Tomei conhecimento</button></div>`);
}
const invAtraso = i => i.estado !== 'feito' && invFim(i) < hoje();
const invDatas = i => i.dataFim && i.dataFim !== i.data ? `${fmtData(i.data).slice(0, 5)} a ${fmtData(i.dataFim)}` : fmtData(i.data);
function invTipoTxt(i) { return i.tipo === 'global' ? 'Global' : 'Parcial · ' + invCats(i).map(c => INV_CAT_NOME[c] || c).join(', '); }
const eur = v => (v == null || isNaN(v)) ? '—' : new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' }).format(v);
const lojaSemJSC = id => { const l = S.lojas.find(x => x.id === id); return !!(l && l.semJSC); };
const invCats = i => i.tipo === 'global' ? ['global'] : (i.categorias || []).filter(c => !(c === 'jsc' && lojaSemJSC(i.lojaId)));
const filtraInv = arr => arr.filter(i => i.tipo === 'global' || invCats(i).length);
const catNome = c => c === 'global' ? 'Global' : (INV_CAT_NOME[c] || c);
const catCurto = c => c === 'jsc' ? 'JSC' : catNome(c);
const invTotal = i => i.resultado ? (i.resultado.linhas || []).reduce((s, l) => s + (+l.valor || 0), 0) : null;
function invHTML(i, mostrarLoja = true) {
  const feito = i.estado === 'feito';
  const h = hoje();
  const tot = invTotal(i);
  const st = feito ? (i.resultado ? `<span class="pill ${tot < 0 ? 'bad' : 'ok'}">Resultado ${eur(tot)}</span>` : `<span class="pill ok">✓ Feito</span>`)
    : invFim(i) < h ? '<span class="pill bad">Sem resultado</span>' : (i.data <= h && h <= invFim(i)) ? `<span class="pill warn">${i.dataFim ? 'Esta semana · ' + invDatas(i) : 'Hoje'}</span>` : `<span class="pill">${invDatas(i)}</span>`;
  const podeReg = !feito && podeEscrever() && i.data <= fimSemana();
  const ckp = !feito && i.conhecimento && i.conhecimento.em ? `<span class="pill ok" title="${esc(i.conhecimento.nome || '')}">👁 Tomou conhecimento ${esc(fmtData(i.conhecimento.em.slice(0, 10)).slice(0, 5))} ${esc(new Date(i.conhecimento.em).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' }))}</span>` : '';

/* importação do ficheiro qbr (.xls) */
let XLSXlib = null;
function carregarXLSX() {
  if (XLSXlib) return Promise.resolve(XLSXlib);
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = () => { XLSXlib = window.XLSX; res(XLSXlib); }; s.onerror = rej; document.head.appendChild(s); });

const normNome = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();
async function importarQbr(file) {
  let X; try { X = await carregarXLSX(); } catch (e) { toast('Não foi possível abrir o leitor de Excel.'); return; }
  const wb = X.read(await file.arrayBuffer(), { type: 'array' });
  const rows = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false });
  const lojas = {}; let cur = null;
  rows.forEach(r => (r || []).forEach(c => {
    const s = String(c || ''); let m;
    if ((m = s.match(/^Loja\s*:\s*(.+?)\s*\((-?[\d.,]+)\)\s*$/))) { cur = m[1].trim(); lojas[cur] = lojas[cur] || []; }
    else if (cur && (m = s.match(/Data caixa\s*:\s*(\d\d)\/(\d\d)\/(\d{4})\s*\((-?[\d.,]+)\)/))) lojas[cur].push({ data: `${m[3]}-${m[2]}-${m[1]}`, valor: Math.round(parseFloat(m[4].replace(',', '.')) * 100) / 100 });
  }));
  const nomes = Object.keys(lojas);
  if (!nomes.length) { toast('Não encontrei valores de caixa neste ficheiro.'); return; }
  const auto = n => S.lojas.find(l => (l.aliasesQbr || []).map(normNome).includes(normNome(n)));
  abrirModal(`<h2>Importar quebras de caixa</h2>
    <p class="muted" style="margin-top:-6px">Confirma a que loja corresponde cada nome do ficheiro. Os valores já existentes são atualizados; as justificações mantêm-se.</p>
    ${nomes.map((n, i) => { const a = auto(n); return `<div class="row" style="margin:6px 0"><span class="sp" style="font-size:13.5px"><b>${esc(n)}</b><br><span class="muted">${lojas[n].length} dias · ${eur(lojas[n].reduce((s, x) => s + x.valor, 0))}</span></span>
      <select class="imp-l" data-i="${i}" style="width:190px"><option value="">Ignorar</option>${S.lojas.map(l => `<option value="${esc(l.id)}" ${a && a.id === l.id ? 'selected' : ''}>${esc(l.nome)}</option>`).join('')}</select></div>`; }).join('')}
    <div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn" data-a="fechar">Cancelar</button><button class="btn pri" id="imp-ok">Importar</button></div>`);
  $('#imp-ok').onclick = async () => {
    const mapa = [...document.querySelectorAll('.imp-l')].map(s => [nomes[+s.dataset.i], s.value]).filter(x => x[1]);
    $('#imp-ok').disabled = true; $('#imp-ok').textContent = 'A importar…';
    let n = 0;
    for (const [nomeF, lojaId] of mapa) {
      const l = lojaById(lojaId);
      if (l && !(l.aliasesQbr || []).map(normNome).includes(normNome(nomeF))) await escrever(() => S.db.doc('lojas/' + l.id).update({ aliasesQbr: [...(l.aliasesQbr || []), nomeF] }));
      for (const x of lojas[nomeF]) {
        const id = `${x.data}_${lojaId}`; const ref = S.db.doc('caixaDias/' + id);
        const ex = S.caixaDias.find(d => d.id === id) || (await ref.get().then(s => s.exists ? s.data() : null).catch(() => null));
        const ok = ex ? (ex.valor === x.valor ? true : await escrever(() => ref.update({ valor: x.valor }))) : await escrever(() => ref.set({ lojaId, data: x.data, valor: x.valor, registo: '', nRegisto: '', justificacao: '' }));
        if (!ok) break; n++;
      }
    }
    fecharModal(); toast(`${n} dias importados`);
    const meses = Object.values(lojas).flat().map(x => x.data.slice(0, 7)).sort(); if (meses.length) { S.fq.mes = meses[meses.length - 1]; subscreverCaixaMes(S.fq.mes); render(); }
  };
}

async function recomprimirDataURL(u, max) {
  if (u.length < 900000) return u;
  const img = new Image(); img.src = u; await img.decode();
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.75);
}
async function importarTudo(texto, btn) {
  let dados; try { dados = JSON.parse(texto); } catch (e) { toast('Os dados não são válidos.'); return; }
  if (!dados || dados.app !== 'bagga-ops' || !dados.colecoes) { toast('Este ficheiro não é uma exportação da Bagga Ops.'); return; }
  const n = Object.values(dados.colecoes).reduce((s, a) => s + a.length, 0);
  if (!(await confirmar(`Importar ${n} registos e ${Object.keys(dados.assets || {}).length} fotos? Registos com o mesmo identificador são substituídos.`, 'Importar'))) return;
  btn.disabled = true;

  try {
    let i = 0; const as = Object.entries(dados.assets || {});
    for (const [id, u] of as) {
      i++; btn.textContent = `A importar fotos ${i}/${as.length}…`;
      const nid = 'a_' + id; await S.db.doc('fotosImg/' + nid).set({ data: await recomprimirDataURL(u, 1400), importado: true }); mapa[id] = nid;
    }
    const remap = v => Array.isArray(v) ? v.map(remap) : (v && typeof v === 'object') ? (v.asset && mapa[v.asset] ? (({ asset, ...r }) => ({ ...r, img: mapa[asset] }))(v) : Object.fromEntries(Object.entries(v).map(([k, x]) => [k, remap(x)]))) : v;
    const todos = []; for (const [c, arr] of Object.entries(dados.colecoes)) { if (c === 'membros') continue; arr.forEach(d => todos.push([c, d])); }
    let feitos = 0;
    const lote = async ([c, d]) => { await S.db.doc(c + '/' + d.id).set(remap(d.data)); feitos++; if (feitos % 20 === 0) btn.textContent = `A importar ${feitos}/${todos.length}…`; };
    for (let k = 0; k < todos.length; k += 10) await Promise.all(todos.slice(k, k + 10).map(lote));
    toast(`Importação concluída: ${feitos} registos ✓`);
  } catch (e) { toast('A importação parou: ' + (e && e.message ? e.message : 'erro')); }
  render();
}

function lerRascunho() { try { const r = localStorage.getItem(DRAFT_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function gravarRascunho() { try { if (S.v) localStorage.setItem(DRAFT_KEY, JSON.stringify(S.v)); } catch (e) {} }
function apagarRascunho() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

function iniciarVisita(lojaId) {
  const r = lerRascunho();
  if (r && !lojaId) { S.v = r; }
  else {
    S.v = { lojaId: lojaId || (S.isAdmin ? '' : (minhasLojas()[0]?.id || '')), data: hoje(), notas: '',
      seccoes: S.checklist.seccoes.map(s => ({ titulo: s.titulo, itens: s.itens.map(i => ({ id: i.id, texto: i.texto, r: null, nota: '', tarefa: true })) })) };
  }
  S.view = 'visitaForm'; render(); window.scrollTo(0, 0);
}
function contagem(v) {
  let ok = 0, nok = 0, na = 0, total = 0;
  v.seccoes.forEach(s => s.itens.forEach(i => { total++; if (i.r === 'ok') ok++; else if (i.r === 'nok') nok++; else if (i.r === 'na') na++; }));
  return { ok, nok, na, total, resp: ok + nok + na, pont: ok + nok ? Math.round(ok / (ok + nok) * 100) : null };
}
function itemHTML(si, ii) {
  const i = S.v.seccoes[si].itens[ii];
  return `<div class="item" id="it-${si}-${ii}">

        <button class="nok ${i.r === 'nok' ? 'on' : ''}" data-a="resp" data-s="${si}" data-i="${ii}" data-r="nok" aria-label="Não conforme">✗</button>
        <button class="na ${i.r === 'na' ? 'on' : ''}" data-a="resp" data-s="${si}" data-i="${ii}" data-r="na" aria-label="Não aplicável">N/A</button>
      </div></div>
    ${i.r === 'nok' ? `<div class="item-extra">
      <textarea placeholder="O que está mal e o que deve ser feito?" data-c="nota" data-s="${si}" data-i="${ii}">${esc(i.nota)}</textarea>

}

  return `
  <div class="row"><button class="btn ghost" data-a="ir" data-v="visitas">← Visitas</button><span class="sp"></span><button class="btn sm danger" data-a="descartarVisita">Descartar</button></div>

function atualizarProgresso() {
  const c = contagem(S.v);
  const p = $('#v-prog'); if (p) p.style.width = (c.total ? c.resp / c.total * 100 : 0) + '%';
  const t = $('#v-prog-txt'); if (t) t.textContent = `${c.resp} de ${c.total} respondidos`;
  const s = $('#v-score'); if (s) s.innerHTML = scoreHTML(c.pont);
}
async function concluirVisita() {
  const v = S.v;
  if (!v.lojaId) { toast('Escolhe a loja.'); return; }
  const c = contagem(v);
  if (!c.resp) { toast('Responde a pelo menos um item.'); return; }
  if (c.resp < c.total && !(await confirmar(`Há ${c.total - c.resp} itens sem resposta. Concluir na mesma?`, 'Concluir'))) return;
  const seccoes = v.seccoes.map(s => ({ titulo: s.titulo, itens: s.itens.map(i => ({ id: i.id, texto: i.texto, r: i.r || null, nota: (i.nota || '').trim() })) }));
  const doc = { lojaId: v.lojaId, data: v.data || hoje(), autorId: S.me || null, criadoEm: new Date().toISOString(),
    seccoes, ok: c.ok, nok: c.nok, na: c.na, pontuacao: c.pont, notas: (v.notas || '').trim() };
  const ref = S.db.collection('visitas').doc();
  const ok = await escrever(() => ref.set(doc));
  if (!ok) return;
  const novas = [];
  v.seccoes.forEach(s => s.itens.forEach(i => { if (i.r === 'nok' && i.tarefa) novas.push(i); }));
  for (const i of novas) {
    await escrever(() => S.db.collection('tarefas').add({
      titulo: i.texto, descricao: (i.nota || '').trim(), lojaId: v.lojaId, responsavelId: null, prazo: addDias(7),
      prioridade: 'media', estado: 'aberta', criadoPor: S.me || null, criadoEm: new Date().toISOString(), visitaId: ref.id, notas: [] }));
  }
  apagarRascunho(); S.v = null;
  toast(novas.length ? `Visita guardada · ${novas.length} tarefa(s) criada(s)` : 'Visita guardada');
  S.verVisita = ref.id; S.view = 'visitaVer'; render(); window.scrollTo(0, 0);
}

async function guardarTarefa(id) {
  const d = {
    titulo: $('#tf-t').value.trim(), lojaId: $('#tf-l').value, responsavelId: $('#tf-r').value || null,
    prazo: $('#tf-p').value || null, prioridade: $('#tf-pr').value, estado: $('#tf-e').value, descricao: $('#tf-d').value.trim(),
  };
  if (!d.titulo) { toast('Escreve o título.'); return; }
  if (!d.lojaId) { toast('Escolhe a loja.'); return; }
  if (id) {
    const ex = S.tarefas.find(t => t.id === id);
    const mud = {}; Object.keys(d).forEach(k => { if ((ex[k] ?? null) !== (d[k] ?? null)) mud[k] = d[k]; });
    if (mud.estado === 'feita') { mud.concluidaEm = new Date().toISOString(); mud.concluidaPor = S.me || null; }
    else if (mud.estado) { mud.concluidaEm = null; mud.concluidaPor = null; }
    fecharModal();
    if (Object.keys(mud).length) await escrever(() => S.db.doc('tarefas/' + id).update(mud), 'Tarefa atualizada');
  } else {
    Object.assign(d, { criadoPor: S.me || null, criadoEm: new Date().toISOString(), notas: [], visitaId: null });
    if (d.estado === 'feita') { d.concluidaEm = d.criadoEm; d.concluidaPor = S.me || null; }
    fecharModal();
    await escrever(() => S.db.collection('tarefas').add(d), 'Tarefa criada');
  }
}

  ffHoje: () => { S.ff.data = hoje(); render(); },
  ffDias: el => { S.ff.dias = +el.dataset.v; render(); },
  ffIr: el => { S.ff.data = el.dataset.d; render(); window.scrollTo(0, 0); },
  abrirFotos: el => abrirFotos(el.dataset.l, el.dataset.d, el.dataset.p),
  marcarFoto: async el => {
    const key = el.dataset.k, v = el.dataset.v, doc = S.fotos[key]; if (!doc) return;
    const obs = ($('#fo-obs')?.value || '').trim(); const mkT = $('#fo-t')?.checked;
    fecharModal();
    const ok = await escrever(() => S.db.doc('fotos/' + key).update({ estado: v, obs, verificadoPor: S.me || null, verificadoEm: new Date().toISOString() }), v === 'ok' ? 'Verificada ✓' : 'Marcada como não conforme');
    if (ok && v === 'nok' && mkT) {
      const p = S.periodos.find(x => x.id === doc.periodo);
      await escrever(() => S.db.collection('tarefas').add({ titulo: `Foto ${p ? p.nome : doc.periodo} de ${fmtData(doc.data)}: corrigir`, descricao: obs, lojaId: doc.lojaId, responsavelId: null,
        prazo: addDias(1), prioridade: 'alta', estado: 'aberta', criadoPor: S.me || null, criadoEm: new Date().toISOString(), visitaId: null, notas: [] }), 'Tarefa criada');
    }
  },
  verificarTodas: async el => {
    const d = S.ff.data || hoje();
    const ks = Object.keys(S.fotos).filter(k => { const f = S.fotos[k]; return f.data === d && (f.itens || []).length && !f.estado && lojaById(f.lojaId); });
    if (!ks.length) return;
    if (!(await confirmar(`Marcar como verificadas as ${ks.length} fotos pendentes de ${fmtData(d)}?`, 'Verificar'))) return;
    el.disabled = true; let n = 0;
    for (const k of ks) { if (await escrever(() => S.db.doc('fotos/' + k).update({ estado: 'ok', verificadoPor: S.me || null, verificadoEm: new Date().toISOString() }))) n++; else break; }
    toast(`${n} verificadas ✓`);
  },
  rmFoto: async el => {
    const key = el.dataset.k, i = +el.dataset.i, doc = S.fotos[key]; if (!doc) return;
    if (!(await confirmar('Remover esta foto?', 'Remover'))) return;
    const it = doc.itens[i]; const itens = doc.itens.filter((_, j) => j !== i);
    const ok = await escrever(() => S.db.doc('fotos/' + key).update({ itens, estado: itens.length ? doc.estado : null }), 'Foto removida');
    if (ok) {
      if (it.img) { try { await S.db.doc('fotosImg/' + it.img).delete(); } catch (e) {} }
      if (it.asset && S.assets) { try { await S.assets.delete(it.asset); } catch (e) {} }
    }
  },
  perSave: async () => {
    const ps = S.perEdit.filter(p => p.nome.trim()).map(p => ({ id: p.id, nome: p.nome.trim(), curto: p.nome.trim().slice(0, 7), ate: /^\d\d:\d\d$/.test(p.ate) ? p.ate : '23:59' }));
    if (!ps.length) { toast('É preciso pelo menos um período.'); return; }
    if (await escrever(() => S.db.doc('config/fotos').set({ periodos: ps }), 'Períodos guardados')) { S.periodos = ps; S.perEdit = null; render(); }
  },
  perAdd: () => { perMut().push({ id: 'p' + rid(), nome: '', ate: '12:00' }); render(); },
  perDel: el => { perMut().splice(+el.dataset.i, 1); render(); },
  perCancel: () => { S.perEdit = null; render(); },
  ckAddItem: el => { ckMut().seccoes[+el.dataset.s].itens.push({ id: 'i' + rid(), texto: '' }); render(); },
  ckDelItem: el => { ckMut().seccoes[+el.dataset.s].itens.splice(+el.dataset.i, 1); render(); },
  ckAddSec: () => { ckMut().seccoes.push({ titulo: 'Nova secção', itens: [{ id: 'i' + rid(), texto: '' }] }); render(); },
  ckDelSec: async el => { if (await confirmar('Remover esta secção da checklist?', 'Remover')) { ckMut().seccoes.splice(+el.dataset.s, 1); render(); } },
  ckCancel: () => { S.ckEdit = null; render(); },
  ckSave: async () => {
    const ck = { seccoes: S.ckEdit.seccoes.map(s => ({ titulo: s.titulo.trim() || 'Secção', itens: s.itens.filter(i => i.texto.trim()).map(i => ({ id: i.id, texto: i.texto.trim() })) })).filter(s => s.itens.length) };
    if (!ck.seccoes.length) { toast('A checklist precisa de pelo menos um item.'); return; }
    if (await escrever(() => S.db.doc('config/checklist').set(ck), 'Checklist guardada')) { S.ckEdit = null; S.checklist = ck; render(); }
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (fn) fn(el, e);
});
const C = {
  fiLoja: el => { S.fi.loja = el.value; render(); },
  impTudo: async el => { const f = el.files && el.files[0]; el.value = ''; if (f) { const b = $('#imp-ok'); fecharModal(); importarTudo(await f.text(), document.querySelector('[data-a="impAbrir"]') || document.createElement('button')); } },
  feLoja: el => { S.fe.loja = el.value; render(); },
  fqLoja: el => { S.fq.loja = el.value; render(); },
  faLoja: el => { S.fa.loja = el.value; render(); },
  cxSo: el => { S.fq.so20 = el.checked; render(); },
  lojaJSC: el => escrever(() => S.db.doc('lojas/' + el.dataset.id).update({ semJSC: !el.checked }), el.checked ? 'A loja passa a ter inventários JSC' : 'Inventários JSC escondidos para esta loja'),
  cxReg: el => { cxGuardar(el.dataset.id, 'registo', el.value); const n = el.closest('.cxrow').querySelector('[data-c="cxNum"]'); n.disabled = el.value !== 'sim'; if (el.value === 'sim') n.focus(); else n.value = ''; },
  cxNum: el => { const k = el.dataset.id + '|nRegisto'; clearTimeout((cxPend.get(k) || {}).t); cxPend.delete(k); cxGuardar(el.dataset.id, 'nRegisto', el.value.trim()); },
  cxJust: el => { const k = el.dataset.id + '|justificacao'; clearTimeout((cxPend.get(k) || {}).t); cxPend.delete(k); cxGuardar(el.dataset.id, 'justificacao', el.value.trim()); },
  cxImport: el => { const f = el.files && el.files[0]; el.value = ''; if (f) importarQbr(f); },
  feTot: el => { const s = new Set(S.fe.totEst); el.checked ? s.add(el.value) : s.delete(el.value); S.fe.totEst = [...s]; render(); },
  fiTipo: el => { S.fi.tipo = el.value; render(); },
  fLoja: el => { S.f.loja = el.value; render(); },
  fMinhas: el => { S.f.minhas = el.checked; render(); },
  fvLoja: el => { S.fv.loja = el.value; render(); },
  vLoja: el => { S.v.lojaId = el.value; gravarRascunho(); },
  vData: el => { S.v.data = el.value; gravarRascunho(); },
  vNotas: el => { S.v.notas = el.value; gravarRascunho(); },
  nota: el => { S.v.seccoes[+el.dataset.s].itens[+el.dataset.i].nota = el.value; gravarRascunho(); },
  mkTarefa: el => { S.v.seccoes[+el.dataset.s].itens[+el.dataset.i].tarefa = el.checked; gravarRascunho(); },
  ckSec: el => { ckMut().seccoes[+el.dataset.s].titulo = el.value; refreshCkSave(); },
  ckItem: el => { ckMut().seccoes[+el.dataset.s].itens[+el.dataset.i].texto = el.value; refreshCkSave(); },
  ffData: el => { if (el.value) { S.ff.data = el.value > hoje() ? hoje() : el.value; render(); } },
  ffLoja: el => { S.ff.loja = el.value; try { localStorage.setItem('bagga-loja', el.value); } catch (e) {} render(); },
  foto: el => { const fs = [...(el.files || [])]; if (fs.length) enviarFotos(fs, el.dataset.l, el.dataset.d, el.dataset.p); el.value = ''; },
  perNome: el => { perMut()[+el.dataset.i].nome = el.value; const b = document.querySelector('[data-a="perSave"]'); if (b) b.disabled = false; },
  perAte: el => { perMut()[+el.dataset.i].ate = el.value; const b = document.querySelector('[data-a="perSave"]'); if (b) b.disabled = false; },
};
function perMut() { if (!S.perEdit) S.perEdit = JSON.parse(JSON.stringify(S.periodos)); return S.perEdit; }
function refreshCkSave() { const b = document.querySelector('[data-a="ckSave"]'); if (b) b.disabled = false; }
const viaInput = new Set(['vNotas', 'nota', 'ckSec', 'ckItem', 'perNome']);
document.addEventListener('input', e => { const el = e.target.closest('[data-c]'); if (el && viaInput.has(el.dataset.c)) C[el.dataset.c](el); });
/* gravação automática enquanto se escreve (mapa diário da caixa) */
const cxPend = new Map();
function cxAgendar(el) {
  const campo = el.dataset.c === 'cxNum' ? 'nRegisto' : 'justificacao'; const k = el.dataset.id + '|' + campo;
  clearTimeout((cxPend.get(k) || {}).t);
  const v = el.value.trim();
  cxPend.set(k, { id: el.dataset.id, campo, v, t: setTimeout(() => { cxPend.delete(k); cxGuardar(el.dataset.id, campo, v); }, 1000) });
}
function cxFlush() { cxPend.forEach(x => { clearTimeout(x.t); cxGuardar(x.id, x.campo, x.v); }); cxPend.clear(); }
document.addEventListener('input', e => { const el = e.target.closest('[data-c="cxNum"],[data-c="cxJust"]'); if (el) cxAgendar(el); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') cxFlush(); });
window.addEventListener('pagehide', cxFlush);
document.addEventListener('change', e => { const el = e.target.closest('[data-c]'); if (el && !viaInput.has(el.dataset.c) && C[el.dataset.c]) C[el.dataset.c](el); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) fecharModal();
  if (e.key === 'Enter' && e.target.id === 'novaLoja') A.addLoja();
  if (e.key === 'Enter' && e.target.id === 'tf-n') document.querySelector('[data-a="addNota"]')?.click();
});

/* ---------- render ---------- */
function render() {
  renderNav();
  const app = $('#app');
  if (!S.db && S.ready) { app.innerHTML = '<div class="card empty">Para ver e guardar dados, abre esta app com a sessão iniciada no Claude.</div>'; return; }
  if (S.view === 'lojas' && !S.isAdmin) S.view = 'inicio';
  if (false) {
    app.dataset.v = 'escolher';
    app.innerHTML = `<div class="card" style="max-width:460px;margin:30px auto;padding:20px">
      <h2 style="margin-top:0">Bem-vindo 👋</h2><p class="muted" style="margin-top:-6px">Escolhe a tua loja para começares a usar a app.</p>
      <label class="f">A tua loja</label><select id="el-l"><option value="">Escolhe…</option>${S.lojas.map(l => `<option value="${esc(l.id)}">${esc(l.nome)}</option>`).join('')}</select>
      <label class="f">O teu nome</label><input type="text" id="el-n" value="${esc(S.meuNome || '')}" placeholder="Nome e apelido">
      <div class="row mt"><span class="sp"></span><button class="btn pri" data-a="escolherLoja">Entrar</button></div></div>`;
    return;
  }
  if (S.view === 'visitas' || S.view.startsWith('visita')) S.view = 'inicio';
  const views = { inicio: vInicio, tarefas: vTarefas, visitas: vVisitas, visitaForm: vVisitaForm, visitaVer: vVisitaVer, lojas: vLojas, fotos: vFotos, inventarios: vInventarios, encomendas: vEncomendas, caixa: vCaixa, avarias: vAvarias };
  // não redesenhar o formulário de visita/checklist por baixo do utilizador quando chegam dados
  if (render.lock && (S.view === 'visitaForm') && app.dataset.v === 'visitaForm') return;
  app.dataset.v = S.view;
  app.innerHTML = (views[S.view] || vInicio)();
  document.querySelectorAll('.gtabwrap').forEach(w => { w.scrollLeft = w.scrollWidth; });
}
let renderPendente = false;
const aEscrever = () => { const a = document.activeElement; return !!(a && $('#app').contains(a) && a.matches('input:not([type=checkbox]):not([type=file]),textarea,select')); };
document.addEventListener('focusout', () => setTimeout(() => { if (renderPendente && !aEscrever()) { renderPendente = false; renderDados(); } }, 150));
let renderTimer = null;
function renderDados() { clearTimeout(renderTimer); renderTimer = setTimeout(renderDadosAgora, 40); }
function renderDadosAgora() {
  if (aEscrever()) { renderPendente = true; renderNav(); return; }
  // chamado quando chegam dados: evita apagar o que se está a escrever
  if (S.view === 'visitaForm') { renderNav(); return; }
  if (S.view === 'lojas' && (S.ckEdit || S.perEdit) && document.activeElement && document.activeElement.matches('[data-c^="ck"],[data-c^="per"]')) return;
  if (!$('#modal').hidden && document.activeElement && $('#sheet').contains(document.activeElement)) { render(); return; }
  render();
}

/* ---------- arranque ---------- */
async function init() {
  render();
  if (!window.APP || !window.APP.use) { S.ready = true; render(); return; }
  const [db, user] = await Promise.all([window.APP.use('db'), window.APP.use('user')]);
  S.db = db; S.user = user; S.ready = true;
  if (user) {
    try { S.me = await user.id(); } catch (e) {}
    try { S.isOwner = !!(await user.isOwner()); } catch (e) {}
    S.isAdmin = S.isOwner;
    try { const c = await user.can('data.write'); S.canWrite = c === null || c === undefined ? true : !!c; } catch (e) {}
    try { const me = await user.me(); S.meuNome = (me && me.name) || ''; $('#quem').textContent = (me && me.name) ? `Olá, ${me.name.split(' ')[0]}` : 'Lojas Bagga'; } catch (e) { $('#quem').textContent = 'Lojas Bagga'; }
  } else $('#quem').textContent = 'Lojas Bagga';
  if (IS_PWA) {
    const sb = document.getElementById('sair'); if (sb) sb.hidden = false;
    S.meuCodigo = window.PWA_INFO && window.PWA_INFO.codigo;
    if (S.isAdmin && db) {
      db.collection('codigos').onSnapshot(s => { S.codigos = s.docs.map(d => ({ id: d.id, data: d.data() })); renderDados(); }, () => {});
      db.collection('sessoes').onSnapshot(s => { S.sessoes = s.docs.map(d => ({ id: d.id, data: d.data() })); renderDados(); }, () => {});
    }
  }
  if (!S.isAdmin) { S.view = 'fotos'; try { S.ff.loja = localStorage.getItem('bagga-loja') || ''; } catch (e) {} if (!S.ff.loja && window.PWA_INFO && window.PWA_INFO.lojaId) S.ff.loja = window.PWA_INFO.lojaId; }
  if (!db) { render(); return; }
  window.APP.use('assets').then(a => { S.assets = a; }).catch(() => {});
  setInterval(() => { if (S.view === 'fotos' || S.view === 'inicio') { if ($('#modal').hidden) renderDados(); } }, 60000);

  let confirmados = 0;
  const SEM_NET = 'Sem ligação à internet. O que vês pode estar desatualizado — o que registares é enviado assim que a ligação voltar.';
  const verificar = () => db.doc('config/fotos').get({ source: 'server' }).then(() => aviso('')).catch(() => aviso(SEM_NET));
  const timer = setTimeout(verificar, 10000);
  setInterval(() => { if (!$('#aviso').hidden) verificar(); }, 20000);
  window.addEventListener('online', verificar);
  window.addEventListener('offline', () => aviso(SEM_NET));
  const confirma = snap => { if (!snap.metadata.fromCache) { confirmados++; if (confirmados >= 8) { clearTimeout(timer); aviso(''); } } };
  const erro = e => { clearTimeout(timer); if (e && e.code !== 'revoked') aviso('Houve um problema a ler os dados. Volta a abrir a app mais tarde.'); };
  const docs = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));

  db.collection('membros').limit(500).onSnapshot(snap => { S.membros = docs(snap); S.loaded.membros = true; carregarPerfis(S.membros.map(m => m.id)); renderDados(); }, () => { S.loaded.membros = true; renderDados(); });
  db.collection('lojas').onSnapshot(snap => {
    S.lojas = docs(snap).sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt'));
    if (S.invRaw) S.inventarios = filtraInv(S.invRaw);
    S.loaded.lojas = true; confirma(snap);
    carregarPerfis(S.lojas.flatMap(l => l.gerentes || []));
    renderDados();
  }, erro);
  db.collection('tarefas').limit(1000).onSnapshot(snap => {
    S.tarefas = docs(snap); S.loaded.tarefas = true; confirma(snap);
    carregarPerfis(S.tarefas.flatMap(t => [t.responsavelId, t.criadoPor, t.concluidaPor, ...(t.notas || []).map(n => n.autorId)]));
    renderDados();
  }, erro);
  db.collection('visitas').orderBy('data', 'desc').limit(300).onSnapshot(snap => {
    S.visitas = docs(snap); S.loaded.visitas = true; confirma(snap);
    carregarPerfis(S.visitas.map(v => v.autorId));
    renderDados();
  }, erro);
  if (S.isOwner) db.collection('gastos').orderBy('data', 'desc').limit(1000).onSnapshot(snap => { S.gastos = docs(snap); S.loaded.gastos = true; renderDados(); }, () => { S.loaded.gastos = true; });
  db.collection('avarias').orderBy('criadoEm', 'desc').limit(500).onSnapshot(snap => {
    S.avarias = docs(snap); S.loaded.avarias = true; confirma(snap);
    carregarPerfis(S.avarias.flatMap(a => [a.criadoPor, ...(a.notas || []).map(n => n.autorId)]));
    renderDados();
  }, erro);
  db.collection('caixaDias').orderBy('data', 'desc').limit(1).get().then(s => {
    const d = s.docs[0] && s.docs[0].data(); if (!d || !d.data) return;
    S.cxUltimoMes = d.data.slice(0, 7);
    if (!S.fq.mesUser) { S.fq.mes = S.cxUltimoMes; subscreverCaixaMes(S.fq.mes); renderDados(); }
  }).catch(() => {});
  db.collection('quebrasCaixa').orderBy('data', 'desc').limit(1000).onSnapshot(snap => {
    S.quebras = docs(snap); S.loaded.quebras = true; confirma(snap);
    carregarPerfis(S.quebras.flatMap(q => [q.justificadoPor, q.criadoPor]));
    renderDados();
  }, erro);
  db.collection('encomendas').orderBy('criadoEm', 'desc').limit(500).onSnapshot(snap => {
    S.encomendas = docs(snap); S.loaded.encomendas = true; confirma(snap);
    carregarPerfis(S.encomendas.flatMap(e => [e.criadoPor, e.atualizadoPor]));
    renderDados();
  }, erro);
  db.doc('config/palamenta').onSnapshot(snap => { if (snap.exists && snap.data().lista) S.palamenta = snap.data().lista; }, () => {});
  db.collection('inventarios').where('data', '>=', addDias(-120)).limit(1000).onSnapshot(snap => {
    S.invRaw = docs(snap); S.inventarios = filtraInv(S.invRaw); S.loaded.inventarios = true; confirma(snap);
    setTimeout(avisoInventario, 600);
    carregarPerfis(S.inventarios.flatMap(i => [i.feitoPor, i.resultado && i.resultado.por]));
    renderDados();
  }, erro);
  db.collection('fotos').where('data', '>=', addDias(-(JANELA_DIAS - 1))).limit(1000).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = { id: d.id, ...d.data() }; });
    S.fotos = m; S.loaded.fotos = true; confirma(snap);
    carregarPerfis(Object.values(m).flatMap(f => [...(f.itens || []).map(i => i.autorId), f.verificadoPor]));
    renderDados();
    const k = $('#sheet').dataset.foto;
    if (k && !$('#modal').hidden && !($('#sheet').contains(document.activeElement) && document.activeElement.tagName === 'TEXTAREA')) { const [d, ...r] = k.split('_'); const pid = r.pop(); abrirFotos(r.join('_'), d, pid); }
  }, erro);
  db.doc('config/fotos').onSnapshot(snap => {
    if (snap.exists) { const d = snap.data(); if (d && Array.isArray(d.periodos) && d.periodos.length) { S.periodos = d.periodos; if (!S.perEdit) renderDados(); } }
  }, () => {});
  db.doc('config/checklist').onSnapshot(snap => {
    if (snap.exists) { const d = snap.data(); if (d && Array.isArray(d.seccoes) && d.seccoes.length) S.checklist = d; }
    if (S.view === 'lojas' && !S.ckEdit) render();
  }, () => {});
}
window.APP_READY.then(init);
</script>
</body>
</html>
